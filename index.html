<style>
  :root{
    --bg:#0b0b0e;
    --fg:#f2f2f4;
    --dim:rgba(242,242,244,.55);
    --accent:#ffd166;
    --pad-t:env(safe-area-inset-top,0px);
    --pad-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    text-align:left;overflow:hidden;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

  .stage{position:absolute;inset:0;touch-action:pan-y}
  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    will-change:transform;transform:translate3d(0,0,0)}
  .slide img{width:100%;height:100%;object-fit:contain;display:block;
    -webkit-user-drag:none;user-select:none}
  .slide .ph{position:absolute;inset:0;background-size:cover;background-position:center;
    filter:blur(18px) saturate(1.2);transform:scale(1.06);opacity:1;transition:opacity .45s ease;pointer-events:none}
  .slide.ready .ph{opacity:0}
  .slide img{opacity:0;transition:opacity .35s ease}
  .slide.ready img{opacity:1}

  .cap{position:absolute;left:0;right:0;bottom:calc(28px + var(--pad-b));
    padding:0 22px;text-align:center;font-size:14.5px;line-height:1.4;color:var(--fg);
    text-shadow:0 1px 12px rgba(0,0,0,.85);opacity:0;transition:opacity .4s ease;pointer-events:none}
  .cap.on{opacity:1}

  .dots{position:absolute;left:0;right:0;bottom:calc(10px + var(--pad-b));
    display:flex;gap:7px;justify-content:center;align-items:center;z-index:5}
  .dot{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.28);
    transition:all .28s cubic-bezier(.4,0,.2,1);cursor:pointer}
  .dot.on{background:var(--fg);width:20px}
  .dot:active{transform:scale(.85)}

  .bar{position:fixed;top:0;left:0;height:2px;background:var(--accent);
    width:0;transition:width .3s ease;z-index:9;opacity:.9}

  .top{position:fixed;top:calc(10px + var(--pad-t));left:0;right:0;z-index:8;
    display:flex;justify-content:space-between;align-items:center;padding:0 14px;
    font-variant-numeric:tabular-nums}
  .pill{background:rgba(20,20,24,.55);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border-radius:99px;padding:5px 11px;
    font-size:12.5px;letter-spacing:.02em;color:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.08);cursor:pointer;user-select:none}
  .pill:active{transform:scale(.95)}
  .pill.hidden{opacity:0;pointer-events:none}

  .nav{position:absolute;top:0;bottom:0;width:26%;z-index:4;display:flex;
    align-items:center;justify-content:center;opacity:0;transition:opacity .25s;cursor:pointer}
  .nav:hover{opacity:.9}
  .nav span{width:38px;height:38px;border-radius:99px;background:rgba(20,20,24,.5);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#fff}
  .nav.prev{left:0;justify-content:flex-start;padding-left:8px}
  .nav.next{right:0;justify-content:flex-end;padding-right:8px}
  @media (hover:none){.nav{display:none}}

  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:6;pointer-events:none;opacity:0;transition:opacity .5s}
  .hint.on{opacity:1}
  .hint .inner{background:rgba(15,15,18,.66);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 20px;
    font-size:13.5px;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:10px}
  .hint .hand{font-size:18px;animation:swipe 1.5s ease-in-out infinite}
  @keyframes swipe{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}

  .grid{position:fixed;inset:0;z-index:20;background:rgba(8,8,10,.94);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    padding:calc(54px + var(--pad-t)) 12px calc(16px + var(--pad-b));
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:auto;
    opacity:0;pointer-events:none;transition:opacity .28s ease}
  .grid.on{opacity:1;pointer-events:auto}
  .thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;
    background:#17171c center/cover no-repeat;cursor:pointer;
    outline:none;border:2px solid transparent;transition:transform .18s ease,border-color .18s}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb:active{transform:scale(.96)}
  .thumb.on{border-color:var(--accent)}
  .close{position:fixed;top:calc(12px + var(--pad-t));right:14px;z-index:21}

  .zoomwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.96);
    display:none;align-items:center;justify-content:center;overflow:hidden}
  .zoomwrap.on{display:flex}
  .zoomwrap img{max-width:100%;max-height:100%;object-fit:contain;
    transform-origin:center;will-change:transform}
  .hud{position:fixed;bottom:calc(14px + var(--pad-b));left:0;right:0;text-align:center;
    font-size:11.5px;color:var(--dim);z-index:7;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage"></div>
  <div class="nav prev" id="prevBtn"><span>‹</span></div>
  <div class="nav next" id="nextBtn"><span>›</span></div>
  <div class="cap" id="cap"></div>
  <div class="dots" id="dots"></div>
  <div class="hint" id="hint"><div class="inner"><span class="hand">👆</span><span>Листай свайпом</span></div></div>
  <div class="top">
    <div class="pill hidden" id="backPill">‹ назад</div>
    <div class="pill" id="counterPill">1 / 5</div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="hud" id="hud"></div>
</div>

<div class="grid" id="grid"></div>
<div class="close pill hidden" id="closePill">закрыть ✕</div>
<div class="zoomwrap" id="zoomwrap"><img id="zoomImg" alt=""></div>

    counterPill.textContent=(i+1)+" / "+n;
    barEl.style.width=((i+1)/n*100)+"%";
    Array.prototype.forEach.call(gridEl.children,function(t,k){ t.classList.toggle("on",k===i); });
    window3();
  }

  function go(to,instant){
    to=Math.max(0,Math.min(n-1,to));
    if(to===i){ layout(); return; }
    i=to;
    layout(!!instant);
    if(navigator.vibrate) try{navigator.vibrate(6);}catch(e){}
  }

  // ---- swipe ----
  var dragging=false,startX=0,startY=0,axis=null,dx=0;
  stage.addEventListener("pointerdown",function(e){
    if(e.target.closest(".dot")) return;
    dragging=true; axis=null; startX=e.clientX; startY=e.clientY; dx=0;
    slides.forEach(function(s){ s.el.style.transition="none"; });
  });
  stage.addEventListener("pointermove",function(e){
    if(!dragging) return;
    var mx=e.clientX-startX, my=e.clientY-startY;
    if(axis===null && (Math.abs(mx)>6||Math.abs(my)>6)) axis=Math.abs(mx)>Math.abs(my)?"x":"y";
    if(axis!=="x") return;
    if(e.cancelable) e.preventDefault();
    dx=mx;
    var w=stage.clientWidth, edge=(i===0&&dx>0)||(i===n-1&&dx<0);
    var damp=edge?0.35:1;
    slides.forEach(function(s,idx){
      var off=idx-i;
      var base=(off===0)?0:(off<0?-1:1)*w*0.92;
      var x=base+dx*damp;
      s.el.style.transform="translate3d("+x+"px,0,0)";
      var near=Math.abs(off)===1 ? Math.min(1,Math.abs(dx)/w) : (off===0?1-Math.min(.6,Math.abs(dx)/w):0);
      s.el.style.opacity=String(near);
      s.el.style.zIndex=(off===0)?3:2;
      s.el.style.visibility="visible";
    });
    barEl.style.opacity="0.35";
  });
  function endDrag(){
    if(!dragging) return; dragging=false;
    var w=stage.clientWidth, threshold=w*0.18;
    var moved = axis==="x" && Math.abs(dx)>threshold;
    slides.forEach(function(s){ s.el.style.transition=""; });
    barEl.style.opacity="";
    if(moved) go(dx<0? i+1 : i-1);
    else { layout(); }
    dx=0;
  }
  stage.addEventListener("pointerup",endDrag);
  stage.addEventListener("pointercancel",endDrag);
  stage.addEventListener("pointerleave",endDrag);

  // ---- click / doubletap ----
  var lastTap=0, tapTimer=null;
  stage.addEventListener("click",function(e){
    if(Math.abs(dx)>8) return;
    var now=Date.now();
    if(now-lastTap<300){ clearTimeout(tapTimer); lastTap=0; openZoom(); return; }
    lastTap=now;
    tapTimer=setTimeout(function(){
      var w=stage.clientWidth;
      var x=(e.clientX!=null? e.clientX : w/2);
      if(x>w*0.75 && i<n-1) go(i+1); else if(x<w*0.25 && i>0) go(i-1);
      else setGrid(true);
    },300);
  });

  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight") go(i+1);
    else if(e.key==="ArrowLeft") go(i-1);
    else if(e.key==="Escape"){ if(zoomwrap.classList.contains("on")) closeZoom(); else setGrid(false); }
    else if(e.key==="Home") go(0);
    else if(e.key==="End") go(n-1);
  });

  document.getElementById("prevBtn").onclick=function(){ go(i-1); };
  document.getElementById("nextBtn").onclick=function(){ go(i+1); };

  // ---- grid ----
  function setGrid(on){
    gridEl.classList.toggle("on",on);
    closePill.classList.toggle("hidden",!on);
  }
  counterPill.onclick=function(){ setGrid(!gridEl.classList.contains("on")); };
  closePill.onclick=function(){ setGrid(false); };
  backPill.onclick=function(){ setGrid(false); };

  // ---- zoom ----
  var zScale=1;
  function openZoom(){
    var s=slides[i]; if(!s.img.src) return;
    zoomImg.src=s.img.src; zoomImg.style.transform="scale(1)"; zScale=1;
    zoomwrap.classList.add("on");
  }
  function closeZoom(){ zoomwrap.classList.remove("on"); }
  zoomwrap.addEventListener("click",closeZoom);
  zoomwrap.addEventListener("wheel",function(e){
    if(!zoomwrap.classList.contains("on")) return;
    e.preventDefault();
    zScale=Math.max(1,Math.min(6,zScale*(e.deltaY<0?1.12:0.89)));
    zoomImg.style.transform="scale("+zScale+")";
  },{passive:false});
  var zDist=0,zBase=1;
  zoomwrap.addEventListener("touchstart",function(e){
    if(e.touches.length===2){ zDist=dist(e.touches); zBase=zScale; }
  },{passive:true});
  zoomwrap.addEventListener("touchmove",function(e){
    if(e.touches.length===2){ var d=dist(e.touches); zScale=Math.max(1,Math.min(6,zBase*d/zDist)); zoomImg.style.transform="scale("+zScale+")"; if(e.cancelable) e.preventDefault(); }
  },{passive:false});
  function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }

  // ---- hint ----
  function maybeHint(){
    try{ if(localStorage.getItem("carouselHintSeen")) return; }catch(e){}
    setTimeout(function(){
      hintEl.classList.add("on");
      setTimeout(function(){ hintEl.classList.remove("on"); try{localStorage.setItem("carouselHintSeen","1");}catch(e){} }, 2300);
    }, 500);
  }

  // ---- autoplay (optional) ----
  if(AUTOPLAY_MS>0){
    var startAuto=function(){ autoTimer=setInterval(function(){ go(i+1>=n?0:i+1); },AUTOPLAY_MS); };
    var stopAuto=function(){ clearInterval(autoTimer); };
    document.addEventListener("visibilitychange",function(){ document.hidden?stopAuto():startAuto(); });
    startAuto();
    stage.addEventListener("pointerdown",stopAuto);
  }

  // ---- deep link ?i=3 / #3 ----
  function deepLink(){
    var m=(location.search.match(/[?&]i=(\d+)/)||[])[1] || (location.hash.match(/^#(\d+)$/)||[])[1];
    if(m!=null){ var v=parseInt(m,10); if(!isNaN(v)) i=Math.max(0,Math.min(n-1,v)); }
  }

  function resize(){ layout(); }

  try{ if(window.Telegram && window.Telegram.WebApp){ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); try{window.Telegram.WebApp.setHeaderColor("#0b0b0e");}catch(e){} document.getElementById("backPill").classList.add("hidden"); } }catch(e){}

  deepLink();
  build();
  layout(true);
  maybeHint();
  hudEl.textContent = location.hostname ? "" : "";
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",resize);
  document.addEventListener("gesturestart",function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
